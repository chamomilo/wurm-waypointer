        requiredClasses.each { requiredClass ->
            if (contents.matching { include requiredClass }.files.empty) {
                throw new GradleException(
                        'Installable Wurm Waypointer artifact is incomplete; missing ' +
                                requiredClass)
            }
        }
        def markerAsset = 'org/waypoints/next/markers/archaeology-report-scroll.png'
        if (contents.matching { include markerAsset }.files.empty) {
            throw new GradleException(
                    'Installable Wurm Waypointer artifact is missing ' + markerAsset)
        }
        def mapWordmark = 'org/waypoints/next/map/sklotopolis-wordmark.png'
        if (contents.matching { include mapWordmark }.files.empty) {
            throw new GradleException(
                    'Installable Wurm Waypointer artifact is missing ' + mapWordmark)
        }
        def mapParchment = 'org/waypoints/next/map/sklotopolis-map-parchment.png'
        if (contents.matching { include mapParchment }.files.empty) {
            throw new GradleException(
                    'Installable Wurm Waypointer artifact is missing ' + mapParchment)
        }
        def forbidden = contents.matching {
            include 'com/hypercore/**'
            include 'com/wurmonline/client/renderer/gui/WaypointComponent.class'
            include 'com/wurmonline/client/renderer/gui/WindowWaypointManager.class'
            include 'com/wurmonline/client/renderer/gui/WindowNewWaypoint.class'
        }.files
        if (!forbidden.empty) {
            throw new GradleException('Legacy Waypoints runtime classes entered the artifact: ' + forbidden)
        }
    }
}

task dist(type: Zip, dependsOn: [test, verifyArtifact]) {
    archiveFileName = "wurm-waypointer-${project.version}.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into('mods/wurm-waypointer') {
        from jar
        from rootProject.file('README.md')
        from rootProject.file('THIRD_PARTY_NOTICES.md')
        from rootProject.file('LICENSE')
        from rootProject.file('COPYING.LESSER')
        into('assets') {
            from(rootProject.file(
                    'client-wurm/src/main/resources/org/waypoints/next/map')) {
                include 'sklotopolis-wordmark.png'
                include 'sklotopolis-map-parchment.png'
            }
        }
    }
    into('mods') {
        from rootProject.file('mods/wurm-waypointer.properties')
        from rootProject.file('mods/wurm-waypointer.config')
    }

    doLast {
        def actual = []
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (!entry.isDirectory()) actual << entry.name
            }
        } finally {
            archive.close()
        }
        actual.sort()
        def expected = [
                'mods/wurm-waypointer.properties',
                'mods/wurm-waypointer.config',
                'mods/wurm-waypointer/README.md',
                'mods/wurm-waypointer/THIRD_PARTY_NOTICES.md',
                'mods/wurm-waypointer/LICENSE',
                'mods/wurm-waypointer/COPYING.LESSER',
                'mods/wurm-waypointer/assets/sklotopolis-wordmark.png',
                'mods/wurm-waypointer/assets/sklotopolis-map-parchment.png',
                'mods/wurm-waypointer/wurm-waypointer.jar'
        ].sort()
        if (actual != expected) {
            throw new GradleException('Installable ZIP contains unexpected files:\n'
                    + 'expected=' + expected + '\nactual=' + actual)
        }
    }
}

build.dependsOn verifyArtifact
