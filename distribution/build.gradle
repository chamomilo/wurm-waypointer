task dist(type: Zip, dependsOn: [test, verifyArtifact, ':client-wurm:verifyChamomiloUpdater', ':client-wurm:verifyWaypointerUi']) {
    archiveFileName = "wurm-waypointer-${project.version}.zip"
    destinationDirectory = file("${buildDir}/distributions")

    into('mods/wurm-waypointer') {
        from jar
        from rootProject.file('README.md')
        from rootProject.file('THIRD_PARTY_NOTICES.md')
        from rootProject.file('LICENSE')
        into('docs') {
            from rootProject.file('docs/wurm-waypointer-banner.png')
            from rootProject.file('docs/UPDATER_BUTTONS.md')
            from rootProject.file('docs/WAYPOINTER_HUB.md')
            from rootProject.file('docs/RENDER_DIAGNOSTICS.md')
            from rootProject.file('docs/button-groups.json')
        }
        into('assets/gallery') {
            from(rootProject.file(
                    'client-wurm/src/main/resources/org/waypoints/next/map/gallery')) {
                include '*.png'
            }
        }
        into('assets/compass') {
            from(rootProject.file('render-wurm/src/main/resources/org/waypoints/next/compass')) {
                include 'compass-hud-base.png', 'compass-hud-needle.png'
            }
        }

    }
    into('mods') {
        from rootProject.file('mods/wurm-waypointer.properties')
        from rootProject.file('mods/wurm-waypointer.config')
    }

    doLast {
        def actual = []
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (!entry.isDirectory()) actual << entry.name
            }
            def metadataEntry = archive.getEntry('mods/wurm-waypointer.properties')
            if (metadataEntry == null) throw new GradleException('ZIP is missing shared-updater metadata')
            def packagedMetadata = new Properties()
            archive.getInputStream(metadataEntry).withCloseable { packagedMetadata.load(it) }
            verifyUpdateMetadata(packagedMetadata)
            def packagedJar = archive.getEntry("mods/wurm-waypointer/wurm-waypointer-${project.version}.jar")
            if (packagedJar == null) throw new GradleException('ZIP is missing the mod JAR')
            def temporary = java.nio.file.Files.createTempFile(buildDir.toPath(), 'updater-zip-audit-', '.jar')
            try {
                archive.getInputStream(packagedJar).withCloseable {
                    java.nio.file.Files.copy(it, temporary, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
                verifyEmbeddedUpdater(temporary.toFile())
            } finally { java.nio.file.Files.deleteIfExists(temporary) }
        } finally {
            archive.close()
        }
        actual.sort()
        def expected = [
                'mods/wurm-waypointer.properties',
                'mods/wurm-waypointer.config',
                'mods/wurm-waypointer/README.md',
                'mods/wurm-waypointer/THIRD_PARTY_NOTICES.md',
                'mods/wurm-waypointer/LICENSE',
                'mods/wurm-waypointer/docs/wurm-waypointer-banner.png',
                'mods/wurm-waypointer/docs/UPDATER_BUTTONS.md',
                'mods/wurm-waypointer/docs/WAYPOINTER_HUB.md',
                'mods/wurm-waypointer/docs/RENDER_DIAGNOSTICS.md',
                'mods/wurm-waypointer/docs/button-groups.json',
                'mods/wurm-waypointer/assets/gallery/liberty.png',
                'mods/wurm-waypointer/assets/gallery/novus.png',
                'mods/wurm-waypointer/assets/gallery/caza.png',
                'mods/wurm-waypointer/assets/gallery/infinity-r5.png',
                'mods/wurm-waypointer/assets/gallery/old-infinity.png',
                'mods/wurm-waypointer/assets/compass/compass-hud-base.png',
                'mods/wurm-waypointer/assets/compass/compass-hud-needle.png',
                "mods/wurm-waypointer/wurm-waypointer-${project.version}.jar"
        ].sort()
        if (actual != expected) {
            throw new GradleException('Installable ZIP contains unexpected files:\n'
                    + 'expected=' + expected + '\nactual=' + actual)
        }
    }
}

build.dependsOn verifyArtifact

task verifyUiKit(type: Exec, dependsOn: jar) {
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', 'C:/projects/interface items/tools/Verify-UiKitEmbedding.ps1',
            '-ModJar', jar.archiveFile.get().asFile.absolutePath,
            '-ReferenceJar', 'C:/projects/updater/dependencies/chamomilo-ui-0.4.4.jar'
}
dist.dependsOn verifyUiKit
