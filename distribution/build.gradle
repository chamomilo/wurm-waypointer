apply plugin: 'java'

configurations {
    bundled { transitive = false }
}

dependencies {
    bundled project(':api')
    bundled project(':core')
    bundled project(':feature-archaeology')
    bundled project(':feature-lootmaps')
    bundled project(':feature-map')
    bundled project(':feature-deeds')
    bundled project(':feature-surroundings')
    bundled project(':render-wurm')
    bundled project(':client-wurm')
}

def expectedUpdateMetadata = [
        classname: 'org.waypoints.next.WurmWaypointerMod',
        classpath: "wurm-waypointer-${project.version}.jar".toString(),
        version: project.version.toString(),
        sharedClassLoader: 'true',
        updateProvider: 'chamomilo',
        updateCoordinatorProtocol: '1',
        updateId: 'wurm-waypointer',
        updateName: 'Waypointer',
        updateRepo: 'chamomilo/wurm-waypointer',
        updateAsset: 'wurm-waypointer-{version}.zip'
]
def updaterProject = project(':client-wurm')
def updaterReference = new File(updaterProject.chamomiloUpdaterReference.toString())
def updaterVersionInfo = new Properties()
new File(updaterReference, 'version.properties').withInputStream { updaterVersionInfo.load(it) }
def updaterVersion = updaterVersionInfo.getProperty('version')
expectedUpdateMetadata.updateModuleVersion = updaterVersion
def verifyEmbeddedUpdater = { File artifact ->
    updaterProject.chamomiloUpdaterVerify(updaterProject.chamomiloUpdaterReadEntries(artifact),
            updaterProject.chamomiloUpdaterReadEntries(new File(updaterReference, 'dist/chamomilo-updater.jar')),
            updaterVersion)
}

def verifyUpdateMetadata = { Properties metadata ->
    expectedUpdateMetadata.each { key, expected ->
        if (metadata.getProperty(key) != expected) {
            throw new GradleException("Invalid shared-updater metadata: expected ${key}=${expected}")
        }
    }
}

jar {
    dependsOn ':api:jar', ':core:jar', ':feature-archaeology:jar', ':feature-lootmaps:jar',
            ':feature-map:jar', ':feature-deeds:jar', ':feature-surroundings:jar',
            ':render-wurm:jar', ':client-wurm:jar'
    archiveFileName = "wurm-waypointer-${project.version}.jar"
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from {
        configurations.bundled.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    } { exclude 'META-INF/MANIFEST.MF' }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

task verifyArtifact(dependsOn: [jar, ':verifyArchitectureBoundaries', ':client-wurm:verifyChamomiloUpdater']) {
    doLast {
        verifyEmbeddedUpdater(jar.archiveFile.get().asFile)
        def contents = zipTree(jar.archiveFile.get().asFile)
        ['SharedUpdateCoordinator', 'GitHubReleaseClient', 'ModUpdate', 'UpdateTarget', 'ModCatalog', 'SharedUpdateHooks', 'UpdatePreferences'].each { name ->
            if (contents.matching { include "org/chamomilo/wurm/update/${name}.class" }.files.empty)
                throw new GradleException('Missing shared updater class: ' + name)
        }
        ['com/wurmonline/client/resources/ChamomiloResourceUrl.class',
         'com/wurmonline/client/renderer/gui/ChamomiloSkinnedButton.class',
         'com/wurmonline/client/renderer/gui/WaypointerUi.class',
         'com/wurmonline/client/renderer/gui/WaypointerUiWindow.class'].each { required ->
            if (contents.matching { include required }.files.empty)
                throw new GradleException('Missing shared updater resource: ' + required)
        }
        if (contents.matching { include 'com/wurmonline/client/renderer/gui/ChamomiloUpdateWindow.class' }.files.empty)
            throw new GradleException('Missing shared update window')
        if (contents.matching { include 'com/wurmonline/client/renderer/gui/ChamomiloUpdateBridge.class' }.files.empty)
            throw new GradleException('Missing shared update HUD bridge')
        // The coordinator's Host, registry, release parser and background workers
        // are nested classes. Checking only their enclosing classes is insufficient.
        def updaterClasses = zipTree(project(':client-wurm').tasks.jar.archiveFile.get().asFile)
                .matching {
                    include 'org/chamomilo/wurm/update/*.class'
                    include 'com/wurmonline/client/renderer/gui/ChamomiloUpdateWindow*.class'
                    include 'com/wurmonline/client/renderer/gui/ChamomiloUpdateBridge*.class'
                    include 'com/wurmonline/client/renderer/gui/ChamomiloSkinnedButton*.class'
                }
        updaterClasses.visit { entry ->
            if (!entry.directory && contents.matching { include entry.relativePath.pathString }.files.empty) {
                throw new GradleException('Missing shared updater class: ' + entry.relativePath.pathString)
            }
        }
        def updateMetadata = new Properties()
        rootProject.file('mods/wurm-waypointer.properties').withInputStream { updateMetadata.load(it) }
        verifyUpdateMetadata(updateMetadata)
