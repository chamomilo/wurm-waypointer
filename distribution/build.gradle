                'com/wurmonline/client/renderer/gui/WaypointClusterPickerWindow.class',
                'com/wurmonline/client/renderer/gui/WaypointClusterPickerWindowBridge.class',
                'org/waypoints/next/render/CompassMarkerGeometry.class',
                'org/waypoints/next/render/StaticNavigationController.class',
                'org/waypoints/next/render/WaypointLatePassBridge.class',
                'org/waypoints/next/render/WaypointLatePassParticipant.class',
                'org/waypoints/next/render/NavigationRouteDiagnosticLog.class',
                'com/wurmonline/client/renderer/effects/GroundNavigationRouteEffect.class',
                'org/waypoints/next/navigation/NavigationDraftOverlay.class',
                'org/waypoints/next/render/WaypointWorldBlend.class',
                'org/waypoints/next/render/ManagedResourceRegistry.class'
